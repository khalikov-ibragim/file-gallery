{{- $fullName := include "file-gallery.fullname" . -}}
{{- range .Values.deployments }}
{{- if .nginxConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-frontend-nginx
  labels:
    {{- include "file-gallery.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 10 MB, как лимит multer в backend
        client_max_body_size 10m;

        location /api/ {
            proxy_pass http://{{ $fullName }}-backend:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Образ frontend ещё не пересобран и не умеет брать API_URL из конфига,
        # поэтому подставляем пустой API_URL (запросы пойдут на тот же origin /api/).
        sub_filter '</head>' '<script>window.GALLERY_API_URL="";</script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
{{- end }}
{{- end }}
