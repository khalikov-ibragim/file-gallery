{{- $fullName := include "file-gallery.fullname" . -}}
{{- range .Values.deployments }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-{{ .name }}
  labels:
    {{- include "file-gallery.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "file-gallery.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ .name }}
    {{- if .strategy }}
  strategy:
    type: {{.strategy.type}}
    rollingUpdate:
      maxUnavailable: {{.strategy.rollingUpdate.maxUnavailable}}
      maxSurge: {{.strategy.rollingUpdate.maxSurge}}
    {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "file-gallery.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: "{{ .image.repository }}:{{ .image.tag }}"
          {{- if .readinnessProbe}}
          readinessProbe:
            httpGet:
              path: {{.strategy.readinessProbe.httpGet.path}}
              port: {{.strategy.readinessProbe.httpGet.port}}
            initialDelaySeconds: {{.strategy.readinessProbe.initialDelaySeconds}}
            periodSeconds: {{.strategy.readinessProbe.periodSeconds}}
            {{- end }}
            {{- if .readinnessProbe}}
          livenessProbe:
            httpGet:
              path: {{ .strategy.livenessProbe.httpGet.path }}
              port: {{ .strategy.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .strategy.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .strategy.livenessProbe.periodSeconds }}
          {{- end }}
          {{- if .command }}
          command:
            {{- toYaml .command | nindent 12 }}
          {{- end }}
          {{- if .args }}
          args:
            {{- toYaml .args | nindent 12 }}
          {{- end }}
          ports:
            {{- if .ports }}
            {{- range .ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort | default .port }}
              protocol: TCP
            {{- end }}
            {{- else if .port }}
            - name: http
              containerPort: {{ .service.targetPort | default .port }}
              protocol: TCP
            {{- end }}
          {{- if .env}}
          env:
            {{- range $k, $v := .env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if .envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ $fullName }}-secrets
          {{- end }}
          {{- if .resources }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- end }}
          {{- if and .persistence .persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .persistence.mountPath }}
          {{- end }}
      {{- if and .persistence .persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullName }}-{{ .name }}
      {{- end }}
{{- end }}
