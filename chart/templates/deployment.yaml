{{- $fullName := include "file-gallery.fullname" . -}}
{{- range .Values.deployments }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-{{ .name }}
  labels:
    {{- include "file-gallery.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "file-gallery.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "file-gallery.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ .name }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- if .nginxConfig }}
        checksum/nginx-config: {{ include (print $.Template.BasePath "/frontend-nginx-config.yaml") $ | sha256sum }}
        {{- end }}
    spec:
      containers:
        - name: {{ .name }}
          image: "{{ .image.repository }}:{{ .image.tag }}"
          {{- if .command }}
          command:
            {{- toYaml .command | nindent 12 }}
          {{- end }}
          {{- if .args }}
          args:
            {{- toYaml .args | nindent 12 }}
          {{- end }}
          ports:
            {{- if .ports }}
            {{- range .ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort | default .port }}
              protocol: TCP
            {{- end }}
            {{- else if .port }}
            - name: http
              containerPort: {{ .service.targetPort | default .port }}
              protocol: TCP
            {{- end }}
          {{- if .envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ $fullName }}-secrets
          {{- end }}
          {{- if .resources }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- end }}
          {{- if or (and .persistence .persistence.enabled) .nginxConfig }}
          volumeMounts:
            {{- if and .persistence .persistence.enabled }}
            - name: data
              mountPath: {{ .persistence.mountPath }}
            {{- end }}
            {{- if .nginxConfig }}
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            {{- end }}
          {{- end }}
      {{- if or (and .persistence .persistence.enabled) .nginxConfig }}
      volumes:
        {{- if and .persistence .persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullName }}-{{ .name }}
        {{- end }}
        {{- if .nginxConfig }}
        - name: nginx-config
          configMap:
            name: {{ $fullName }}-frontend-nginx
        {{- end }}
      {{- end }}
{{- end }}
