apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "file-gallery.fullname" . }}-nginx-config
  labels:
    {{- include "file-gallery.labels" . | nindent 4  }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      client_max_body_size 10m;

    resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

    location / { try_files $uri $uri/ /index.html;}

    location /api/ {
      proxy_pass http://file-gallery-backend:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /gallery/ { proxy_pass http://file-gallery-minio:9000;}

    }
