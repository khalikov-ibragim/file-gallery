{{- $fullName := include "file-gallery.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-secrets
  labels:
    {{- include "file-gallery.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with ((.Values.bd | default dict).auth) }}
  POSTGRES_USER: {{ .postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .postgresPassword | quote }}
  POSTGRES_DB: {{ .postgresDb | quote }}
  {{- end }}
  {{- with ((.Values.pgadmin | default dict).auth) }}
  PGADMIN_DEFAULT_EMAIL: {{ .defaultEmail | quote }}
  PGADMIN_DEFAULT_PASSWORD: {{ .defaultPassword | quote }}
  {{- end }}
  {{- with ((.Values.minio | default dict).auth) }}
  MINIO_ROOT_USER: {{ .rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .rootPassword | quote }}
  {{- end }}
  {{- with ((.Values.backend | default dict).auth) }}
  # Внутренние адреса сервисов вычисляются из имени релиза:
  # <release>-bd, <release>-minio. Значения dbHost/minioHost из compose тут не подходят.
  DB_HOST: {{ printf "%s-bd" $fullName | quote }}
  DB_PORT: {{ .dbPort | quote }}
  DB_USER: {{ .dbUser | quote }}
  DB_PASSWORD: {{ .dbPassword | quote }}
  DB_NAME: {{ .dbName | quote }}
  MINIO_HOST: {{ printf "%s-minio" $fullName | quote }}
  MINIO_PORT: {{ .minioPort | quote }}
  MINIO_ACCESS_KEY: {{ .minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .minioSecretKey | quote }}
  MINIO_BUCKET: {{ .minioBucket | quote }}
  MINIO_PUBLIC_URL: {{ .minioPublicUrl | quote }}
  {{- end }}
