minio:
  auth: #название группы
    # Креды корневого пользователя MinIO (должны совпадать с MINIO_ACCESS_KEY/SECRET_KEY)
    rootUser: "minioadmin"
    rootPassword: "minioadmin"

pgadmin:
  auth:
    defaultEmail: "admin@example.com"
    defaultPassword: "admin"

bd:
  auth:
    postgresUser: "postgres"
    postgresPassword: "postgres"
    postgresDb: "gallerydb"

backend:
  auth:
    dbHost: "bd"
    dbPort: "5432"
    dbUser: "postgres"
    dbPassword: "postgres"
    dbName: "gallerydb"
    minioHost: "minio"
    minioPort: "9000"
    minioAccessKey: "minioadmin"
    minioSecretKey: "minioadmin"
    minioBucket: "gallery"
    # Публичный URL, который браузер использует для <img src>. НЕ minio:9000!
    # ВАЖНО: это адрес, доступный из браузера пользователя (см. README).
    minioPublicUrl: "http://localhost:9000"


