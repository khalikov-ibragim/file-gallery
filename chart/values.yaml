namespace: file-gallery

deployments:
  - name: backend
    replicas: 2
    image:
      repository: glimpl/file-gallery-backend
      tag: latest
    imagePullPolicy: IfNotPresent
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    readinessProbe:
      httpGet:
        path: /health
        port: 4000
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /health
        port: 4000
      initialDelaySeconds: 20
      periodSeconds: 10
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
    port: 4000
    service:
      type: ClusterIP
      enabled: true
      port: 4000
      targetPort: 4000
    envFromSecret: true
    resources:
      requests: {memory: "256Mi", cpu: "250m"}
      limits: {memory: "512Mi", cpu: "500m"}

  - name: frontend
    replicas: 1
    image:
      repository: glimpl/file-gallery-frontend
      tag: latest
    port: 80
    env:
      BACKEND_HOST: file-gallery-backend
    service:
      type: NodePort
      enabled: true
      port: 80
      targetPort: 80
    extraVolumeMounts:
      - name: nginx-config
        mountPath: /etc/nginx/conf.d/default.conf
        subPath: default.conf
    extraVolumes:
      - name: nginx-config
        configMap:
          name: file-gallery-nginx-config
    resources:
      requests: {memory: "64Mi", cpu: "65m"}
      limits: {memory: "128Mi", cpu: "130m"}

  - name: bd
    replicas: 1
    image:
      repository: postgres
      tag: 16-alpine
    port: 5432
    service:
      type: ClusterIP
      enabled: true
      port: 5432
      targetPort: 5432
    envFromSecret: true
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /var/lib/postgresql/data
    resources:
      requests: {memory: "256Mi", cpu: "250m"}
      limits: {memory: "512Mi", cpu: "500m"}

  - name: pgadmin
    replicas: 1
    image:
      repository: dpage/pgadmin4
      tag: latest
    port: 80
    service:
      type: NodePort
      enabled: true
      port: 6789
      targetPort: 80
    envFromSecret: true
    resources:
      requests: {memory: "128Mi", cpu: "125m"}
      limits: {memory: "256Mi", cpu: "250m"}

  - name: minio
    replicas: 1
    image:
      repository: glimpl/minio
      tag: RELEASE.2025-09-07T16-13-09Z
    ports:
      - name: api
        port: 9000
        targetPort: 9000
        nodePort: 30900
      - name: console
        port: 9001
        targetPort: 9001
        nodePort: 30901
    args: ["server", "/data", "--console-address", ":9001"]
    service:
      type: NodePort
      enabled: true
    envFromSecret: true
    persistence:
      enabled: true
      size: 2Gi
      mountPath: /data
    resources:
      requests: {memory: "256Mi", cpu: "250m"}
      limits: {memory: "512Mi", cpu: "500m"}
