minio:
  auth: #название группы
    # Креды корневого пользователя MinIO (должны совпадать с MINIO_ACCESS_KEY/SECRET_KEY)
    rootUser: "CHANGE_ME"
    rootPassword: "CHANGE_ME"

pgadmin:
  auth:
    defaultEmail: "CHANGE_ME"
    defaultPassword: "CHANGE_ME"

bd:
  auth:
    postgresUser: "CHANGE_ME"
    postgresPassword: "CHANGE_ME"
    postgresDb: "gallerydb"

backend:
  auth:
    dbHost: "bd"
    dbPort: "5432"
    dbUser: "CHANGE_ME"
    dbPassword: "CHANGE_ME"
    dbName: "gallerydb"
    minioHost: "minio"
    minioPort: "9000"
    minioAccessKey: "CHANGE_ME"
    minioSecretKey: "CHANGE_ME"
    minioBucket: "gallery"
    # Публичный URL, который браузер использует для <img src>. НЕ minio:9000!
    # ВАЖНО: это адрес, доступный из браузера пользователя (см. README).
    minioPublicUrl: ""


