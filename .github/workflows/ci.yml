name: CI
on:
  push:
    branches: [main]
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Copy my repository
        uses: actions/checkout@v4
      # Build compose
      - name: build my containers
        run: docker compose build
      - name: copy .env
        run: cp .env.example .env


      # Run container
      - name: Run container
        run: docker compose up -d
      # health check backend
      - name: wait for backend
        run: |
          for i in $(seq 1 30); do
          if curl -f http://localhost:4000/health; then
          echo "backend ready"
            exit 0
          fi
          echo "waiting... attempt $i"
          sleep 2
          done
          echo "backend did not start in time"
          exit 1

      # TESTING
      - name: testing working my project
        run: sudo apt-get update && sudo apt-get install -y python3-requests
      - name: run test
        run: python3 backend/test_file.py > test_file.txt
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: test-report.txt
      # Login to  docker hub
      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

    # Отправка моих сервисов на dockerhub
      - name: build and push backend
        run: |
          docker tag file-gallery-backend glimpl/file-gallery-backend:latest
          docker push glimpl/file-gallery-backend:latest
      - name: build and push frontend
        run: |
          docker tag file-gallery-backend glimpl/file-gallery-backend:latest
          docker push glimpl/file-gallery-backend:latest
  deploy:
    runs-on: self-hosted
    needs: [workflow]
    steps:
      - name: copy repository
        uses: actions/checkout@v4
      # Login to  docker hub
      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: pull images
        run: docker compose pull
      - name: start containers
        run: docker compose up -d
