name: CI
on:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Copy my repository
        uses: actions/checkout@v4

      - name: install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck
          wget -qO /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo mv /tmp/hadolint /usr/local/bin/hadolint
          sudo chmod +x /usr/local/bin/hadolint
          wget -qO /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          sudo chmod +x /usr/local/bin/kubeconform
      

      - name: download helm
        uses: azure/setup-helm@v4

      - name: lint compose
        run: yamllint -d relaxed docker-compose*.y*ml

      - name: lint dockerfiles
        run: find . -iname "Dockerfile*" -not -path "./node_modules/*" -print0 | xargs -0 -I{} hadolint {}

      - name: lint shell scripts
        run: find . -name "*.sh" -print0 | xargs -0 -I{} shellcheck -P ../../ {}

      - name: helm lint and kubeconform
        run: | 
          helm lint ./chart -f ./chart/values.yaml 
          helm template file-gallery ./chart -f ./chart/values.yaml 
          kubeconform -strict -summary

  workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Copy my repository
        uses: actions/checkout@v4
      # Build compose
      - name: copy .env
        run: cp .env.example .env

      - name: build my containers
        run: docker compose build


      # Run container
      - name: Run container
        run: docker compose up -d
      # health check backend
      - name: wait for backend
        run: |
          for i in $(seq 1 30); do
          if curl -f http://localhost:4000/health; then
          echo "backend ready"
            exit 0
          fi
          echo "waiting... attempt $i"
          sleep 2
          done
          echo "backend did not start in time"
          exit 1

      # TESTING
      - name: testing working my project
        run: sudo apt-get update && sudo apt-get install -y python3-requests
      - name: run test
        run: python3 backend/test_api.py > test_api.txt
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: test_api.txt
      # Login to  docker hub
      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

    # Отправка моих сервисов на dockerhub
      - name: build and push backend
        run: |
          docker compose build backend
          docker push glimpl/file-gallery-backend:latest
          docker tag glimpl/file-gallery-backend:latest glimpl/file-gallery-backend:${GITHUB_SHA::7}    
          docker push glimpl/file-gallery-backend:${GITHUB_SHA::7}
      - name: build and push frontend
        run: |
          docker compose build frontend
          docker push glimpl/file-gallery-frontend:latest
          docker tag glimpl/file-gallery-frontend:latest glimpl/file-gallery-frontend:${GITHUB_SHA::7}  
          docker push glimpl/file-gallery-frontend:${GITHUB_SHA::7}

  deploy:
    runs-on: self-hosted
    needs: [workflow]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: connect to k3 cluster
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          echo "$KUBE_CONFIG_DATA" > /tmp/kubeconfig.yaml
          export KUBECONFIG=/tmp/kubeconfig.yaml
          kubectl cluster-info

      - name: download helm and kubeconform
        uses: azure/setup-helm@v4

      - name: install kubeconform
        run: |
            wget -qO /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
            tar -xzf /tmp/kubeconform.tar.gz -C /tmp
            sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
            sudo chmod +x /usr/local/bin/kubeconform

      - name: secret values
        env:
          HELM_SECRETS: ${{ secrets.FILE_GALLERY_HELM_SECRETS }}
        run: |
          umask 077
          printf '%s\n' "$HELM_SECRETS" >  "$RUNNER_TEMP/values-secrets.yaml"

      - name: helm template and kubeconform
        run: |
          helm template file-gallery ./chart -f ./chart/values.yaml -f "$RUNNER_TEMP/values-secrets.yaml" 
          kubeconform -strict -summary

      - name: helm upgrade
        run: | 
          helm upgrade --install file-gallery ./chart \
            --namespace file-gallery --create-namespace \
            -f ./chart/values.yaml -f "$RUNNER_TEMP/values-secrets.yaml" \
            --set appImageTag=${GITHUB_SHA::7} \
            --wait --rollback-on-failure --timeout 5m

      - name: cleanup
        if: always()
        run: rm -f  "$KUBE_CONFIG_DATA/tmp/kubeconfig.yaml" "$RUNNER_TEMP/values-secrets.yaml"


